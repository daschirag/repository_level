[project]
name = "techdebt-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "deepeval>=4.1.1",
    "evidently>=0.7.21",
    "fastapi>=0.139.2",
    "gitpython>=3.1.52",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.9",
    "llama-cpp-python>=0.3.34",
    "mlflow>=3.14.0",
    "neo4j>=6.2.0",
    "pydriller>=2.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "qdrant-client>=1.18.0",
    "radon>=6.0.1",
    "sentence-transformers>=5.6.0",
    "torch>=2.5.1",
    "transformers>=5.14.1",
    "tree-sitter>=0.21.3,<0.22",
    "tree-sitter-languages>=1.10.2",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds third-party sample repos used as ingestion input, not our tests.
norecursedirs = ["tests/fixtures", ".*", "node_modules", "data", "demo"]
